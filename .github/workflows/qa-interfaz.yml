name: qa-interfaz
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL a probar (por defecto, el alias de develop de landing en Vercel)'
        type: string
        default: 'https://vaiinilla-landing-git-develop-saul1217s-projects.vercel.app'
      update_snapshots:
        description: 'Regenerar referencias (solo si la corrida anterior NO fue bloqueada por datos)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qa-interfaz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ui:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    # Usa secretos de cuentas de CI: solo desde el Environment.
    environment: develop-e2e
    # Toca develop: una corrida a la vez en todos los repos; las demás esperan en cola.
    concurrency:
      group: develop-e2e-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # misma versión que @playwright/test
    env:
      PLAYWRIGHT_CONTAINER: '1'
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url || 'https://vaiinilla-landing-git-develop-saul1217s-projects.vercel.app' }}
      E2E_CLIENTE_EMAIL: ${{ secrets.E2E_CLIENTE_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci
      # Usa la tienda ci-vaiinilla de develop, que ya debe existir: /dev/test-setup no la siembra.
      - name: Pruebas de interfaz
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        shell: bash
        run: |
          args=()
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then args+=(--update-snapshots); fi
          npx playwright test -c playwright.ui.config.ts "${args[@]}"
      # Las referencias nuevas viven en este contenedor: se suben para versionarlas en el repo.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Antes de Lighthouse y aunque falle un paso posterior: las referencias no dependen de él.
        if: ${{ !cancelled() && inputs.update_snapshots }}
        with:
          name: capturas-referencia
          path: e2e-ui/__screenshots__
          retention-days: 7
          if-no-files-found: error
      # El contenedor de Playwright no trae Google Chrome: Lighthouse usa el Chromium de Playwright.
      # Corre como root y con /dev/shm chico, por eso --no-sandbox y --disable-dev-shm-usage.
      # Misma tienda de CI que las pruebas y lighthouserc.json (ci-vaiinilla), no los slugs viejos ci-tienda y ci-canchas.
      - name: Lighthouse
        shell: bash
        env:
          # Dentro del contenedor `git rev-parse HEAD` falla: lhci toma el commit de aquí.
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.deployment.sha || github.sha }}
        run: |
          CHROME_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")"
          export CHROME_PATH
          test -x "$CHROME_PATH" || { echo "No existe el Chromium de Playwright en $CHROME_PATH"; exit 1; }
          npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json \
            --collect.chromePath="$CHROME_PATH" \
            --collect.settings.chromeFlags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --collect.url="$E2E_BASE_URL/pedir" --collect.url="$E2E_BASE_URL/e/ci-vaiinilla/canchas" --collect.url="$E2E_BASE_URL/e/ci-vaiinilla"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Solo si falla, 3 días. Solo el reporte HTML: nunca storageState ni archivos de sesión.
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            !**/storageState*.json
            !**/.auth/**
          retention-days: 3
          if-no-files-found: ignore
